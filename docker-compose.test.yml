# Local Postgres for the integration and E2E suites:
#   docker compose -f docker-compose.test.yml up -d --wait
#   export TEST_DATABASE_URL=postgres://craft@localhost:54329/craft_test
# The test database name must contain "test"; the suites drop and recreate its public schema.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: craft
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: craft_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craft -d craft_test"]
      interval: 3s
      timeout: 3s
      retries: 20
