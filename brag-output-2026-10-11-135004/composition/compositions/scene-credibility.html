<!doctype html>
<html>

  <body>
    <template>
      <style>
        #root {
          position: absolute;

        #cr-stat {

          font-size: 32px;

          display: flex;

        #cr-africa {
          margin-top: 20px;

      <div id="root" data-composition-id="scene-credibility" data-width="1920" data-height="1080">
        <div id="cr-stat">50+</div>
        <div id="cr-stat-label">Years of Combined Experience</div>
        <div id="cr-pills">
          <div class="cr-pill" id="cr-p1">Donors</div>
          <div class="cr-pill" id="cr-p2">Development Partners</div>
          <div class="cr-pill" id="cr-p3">Private Sector</div>
          <div class="cr-pill" id="cr-p4">Government</div>
          <div class="cr-pill" id="cr-p5">Civil Society</div>
        </div>

        <audio id="cr-narration" src="../assets/voice/l03.wav" data-start="0.3" data-track-index="5" data-volume="1"></audio>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#cr-stat", { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 0.4);
        tl.fromTo("#cr-stat-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.75);
        const pills = ["#cr-p1", "#cr-p2", "#cr-p3", "#cr-p4", "#cr-p5"];
        const pillTimes = [2.6, 4.3, 5.9, 7.3, 8.9];
        pills.forEach((p, i) => {
          tl.fromTo(p, { opacity: 0, y: 14, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, pillTimes[i]);
        });
        tl.fromTo("#cr-africa", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 10.8);
        window.__timelines["scene-credibility"] = tl;
      </script>
