<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="CRAFT Prism shield">
  <defs>
    <!-- Dark emerald shield body -->
    <linearGradient id="shieldBody" x1="256" y1="96" x2="256" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="0.55" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <!-- Glowing green-to-gold Delta -->
    <linearGradient id="deltaGrad" x1="256" y1="150" x2="256" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.16" stop-color="#fbbf24"/>
      <stop offset="0.46" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="apexSpark" cx="256" cy="176" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="deltaGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield crest -->
  <path d="M134 116 H378 Q402 116 402 140 V296 Q402 398 256 466 Q110 398 110 296 V140 Q110 116 134 116 Z"
        fill="url(#shieldBody)"/>

  <!-- Inner circuit frame (recedes at small sizes) -->
  <path d="M158 156 H354 Q372 156 372 174 V292 Q372 372 256 426 Q140 372 140 292 V174 Q140 156 158 156 Z"
        fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="6"/>
  <path d="M256 156 V196 M158 292 H210 M354 292 H302" stroke="#34d399" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>

  <!-- Apex glow -->
  <circle cx="256" cy="178" r="44" fill="url(#apexSpark)"/>

  <!-- Delta: outer triangle with inner triangular cutout (evenodd) -->
  <path fill-rule="evenodd" fill="url(#deltaGrad)" filter="url(#deltaGlow)"
        d="M256 152 L364 360 H148 Z M256 240 L308 332 H204 Z"/>
</svg>
