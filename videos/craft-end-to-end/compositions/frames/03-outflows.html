    const state = { v: 0 };
    tl.fromTo(state, { v: 0 }, { v: 88.6, duration: COUNT_DUR, ease: EASE,

    tl.fromTo($("colout"), { scaleY: 0 }, { scaleY: 1, duration: COUNT_DUR, ease: EASE }, COUNT_AT);
    tl.fromTo($("cout"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, COUNT_AT + 0.3);
    tl.fromTo($("bn"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, COUNT_AT + COUNT_DUR);
    tl.fromTo($("vout"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, COUNT_AT + COUNT_DUR);

    tl.fromTo($("tag"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 4.15);

    tl.fromTo($("cin"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.4);

    tl.fromTo($("lfdi"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.9);

    // Scene 4: source line, then hold
