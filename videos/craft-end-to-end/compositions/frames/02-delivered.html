    }, AT);
    // counting down: weight drains, so scale settles DOWN to the static final size
    tl.fromTo(num, { scale: 1.2 }, { scale: 1, duration: DUR, ease: EASE }, AT);
    tl.fromTo($("pct"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, AT + DUR);
