[build]
  command = "vite build"
  publish = "dist/client"
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# ---------------------------------------------------------------------------
# Canonical domain redirect
# ---------------------------------------------------------------------------
# Netlify does not automatically redirect its default *.netlify.app subdomain
# to a site's custom domain, even once one is set — both continue serving
# identical content unless told otherwise, which splits SEO ranking signals
# between two URLs. This makes craftframework.netlify.app permanently redirect
# to the real domain instead.
[[redirects]]
  from = "https://craftframework.netlify.app/*"
  to = "https://craftframework.becomechange.institute/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
# CSP allows 'unsafe-inline' for script-src/style-src rather than a nonce
# because the TanStack Start SSR shell's inline hydration payload couldn't be
# verified locally (the SSR function needs live DATABASE_URL/Identity config
# to boot) — tightening to a nonce-based policy needs testing against a real
# deploy first. Every directive still blocks loading resources from any
# third-party host, which is the main protection against a compromised
# dependency exfiltrating data or injecting a remote script.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# ---------------------------------------------------------------------------
# CRAFT v4.0 — Functions, scheduled jobs & edge auth
# ---------------------------------------------------------------------------
# Serverless functions live in netlify/functions; edge functions in
# netlify/edge-functions (both are the Netlify defaults).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Routing, scheduling and edge path-matching are declared via in-code `config`
# exports (the Netlify-recommended approach, matching netlify/edge-functions/
# lang-detect.ts). They are listed here for visibility:
#
#   [[scheduled_functions]]        →  compliance-alerts.mts  (config.schedule = "@daily")
#     path = "/.netlify/functions/compliance-alerts"
#     schedule = "@daily"          #  daily scan of compliance_items where
#                                  #  due_date - today <= 90 → Resend PU/PUDR/FCR alerts
#
#   [[edge_functions]]             →  auth.ts  (config.path = ["/dashboard/*", ...])
#     function = "auth"            #  decodes netlify-gotrue-jwt, stamps x-craft-org /
#     path = "/dashboard/*"        #  x-craft-role isolation headers, 403s /verify/*
#     path = "/data-room/*"        #  for non-assessor roles
#     path = "/assessment/*"
#     path = "/verify/*"
#
#   presigned-url.mts              →  config.path = "/api/presigned-url"  (Data Room uploads)
#
# ---------------------------------------------------------------------------
# Netlify Database (managed Postgres) — Drizzle ORM
# ---------------------------------------------------------------------------
# Schema lives in db/schema.ts; migrations in netlify/database/migrations are
# applied automatically at deploy time. The following functions read/write the
# database through Drizzle (db/index.ts) and back the React app's data layer:
#
#   questions.mts          →  GET  /api/questions          (question bank; lazily seeds a fresh DB)
#   seed-db.mts            →  POST /api/seed               (idempotent question-bank reseed)
#   organizations.mts      →  GET/POST /api/organizations  (tenants / institutions)
#   responses.mts          →  GET/POST/PUT /api/responses  (assessment scores)
#   capacity-actions.mts   →  GET/PUT /api/capacity-actions (Capacity Improvement Plan)
#   compliance.mts         →  GET/POST/PATCH /api/compliance (Obligations calendar)
#   audit.mts              →  GET/POST /api/audit          (append-only activity log)

# ---------------------------------------------------------------------------
# Workspace platform (orgs, governance, ESG, CAP, evidence, reports, audit)
# ---------------------------------------------------------------------------
# Environment variables (set in the Netlify UI — never commit values):
#   DATABASE_URL      Postgres connection (only for an external DB; Netlify DB is automatic)
#   SENDGRID_API_KEY  report / support email delivery
#   GITHUB_TOKEN      support-bot GitHub issue creation (label `community-question`)
#
#   workspace-api.mts          →  /api/orgs, /api/workspaces/*, /api/support-bot/*
#   evidence-expiry-alerts.mts →  scheduled @daily (evidence expiring in 30 days / expired)
#   weekly-reports.mts         →  scheduled @weekly (CAP summary snapshot per workspace)
