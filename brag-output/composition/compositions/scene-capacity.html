<!doctype html>
<html>
  <head></head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #ffffff;
          overflow: hidden;
          font-family: sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 40px;
        }
        #cap-heading {
          font-family: serif;
          font-weight: 700;
          font-size: 86px;
          color: #064e3b;
        }
        #cap-pills {
          display: flex;
          gap: 24px;
        }
        .cap-pill {
          font-size: 32px;
          padding: 16px 36px;
          border-radius: 30px;
          border: 3px solid #cbd5e1;
          color: #334155;
          font-family: monospace;
        }
        .cap-pill.active {
          border-color: #10b981;
          background: #d1fae5;
          color: #064e3b;
        }
        #cap-custom {
          font-size: 32px;
          padding: 16px 36px;
          border-radius: 30px;
          border: 3px dashed #94a3b8;
          color: #334155;
          font-family: monospace;
        }
        #cap-rows {
          display: flex;
          gap: 40px;
          margin-top: 10px;
        }
        .cap-row {
          font-size: 30px;
          color: #475569;
          font-family: monospace;
          background: #f1f5f9;
          padding: 14px 26px;
          border-radius: 10px;
        }
        #cap-caption {
          margin-top: 28px;
          font-size: 42px;
          color: #064e3b;
          font-family: serif;
          font-weight: 700;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="scene-capacity" data-width="1920" data-height="1080">
        <div id="cap-heading">24-Month Strengthening Plan</div>
        <div id="cap-pills">
          <div class="cap-pill" id="pill-6">6mo</div>
          <div class="cap-pill active" id="pill-12">12mo</div>
          <div class="cap-pill" id="pill-24">24mo</div>
          <div id="cap-custom">47</div>
        </div>
        <div id="cap-rows">
          <div class="cap-row" id="row-1">Due: Month 3</div>
          <div class="cap-row" id="row-2">Due: Month 9</div>
          <div class="cap-row" id="row-3">Due: Month 18</div>
        </div>
        <div id="cap-caption">Any timeframe. Every due date fits.</div>

        <audio id="cap-sfx-click-1" src="../assets/sfx/interface/click_001.ogg" data-start="3" data-duration="0.6" data-track-index="5" data-volume="0.9"></audio>
        <audio id="cap-sfx-snap-1" src="../assets/sfx/interface/switch_002.ogg" data-start="3.1" data-duration="0.6" data-track-index="5" data-volume="0.9"></audio>
        <audio id="cap-sfx-click-2" src="../assets/sfx/interface/click_003.ogg" data-start="7" data-duration="0.6" data-track-index="5" data-volume="0.9"></audio>
        <audio id="cap-sfx-snap-2" src="../assets/sfx/interface/switch_001.ogg" data-start="7.5" data-duration="0.6" data-track-index="5" data-volume="0.9"></audio>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        const heading = document.getElementById("cap-heading");
        const rows = ["#row-1", "#row-2", "#row-3"];

        tl.call(() => {
          document.getElementById("pill-12").classList.remove("active");
          document.getElementById("pill-6").classList.add("active");
          heading.textContent = "6-Month Strengthening Plan";
          document.getElementById("row-1").textContent = "Due: Month 1";
          document.getElementById("row-2").textContent = "Due: Month 3";
          document.getElementById("row-3").textContent = "Due: Month 5";
        }, null, 3.1);
        tl.fromTo(rows, { opacity: 0.2, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 3.1);
        tl.fromTo("#cap-heading", { scale: 1.1 }, { scale: 1, duration: 0.2, ease: "power4.out" }, 3.1);

        tl.call(() => {
          document.getElementById("pill-6").classList.remove("active");
          document.getElementById("cap-custom").classList.add("active");
          heading.textContent = "47-Month Strengthening Plan";
          document.getElementById("row-1").textContent = "Due: Month 12";
          document.getElementById("row-2").textContent = "Due: Month 27";
          document.getElementById("row-3").textContent = "Due: Month 42";
        }, null, 7.5);
        tl.fromTo(rows, { opacity: 0.2, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 7.5);
        tl.fromTo("#cap-heading", { scale: 1.1 }, { scale: 1, duration: 0.2, ease: "power4.out", immediateRender: false }, 7.5);

        tl.fromTo("#cap-caption", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 10.4);

        window.__timelines["scene-capacity"] = tl;
      </script>
    </template>
  </body>
</html>
