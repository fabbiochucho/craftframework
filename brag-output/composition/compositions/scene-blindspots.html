        <div class="bcard" id="card-1">

        <div class="bcard" id="card-2">
          <div class="tag">Blindspot 02</div>

        <div class="bcard" id="card-3">

        <audio id="bs-sfx-1" src="../assets/sfx/interface/click_001.ogg" data-start="0" data-duration="1" data-track-index="5" data-volume="1"></audio>

      <script>
        const tl = gsap.timeline({ paused: true });
        const starts = [0, 2.2, 4.4, 6.6];
        const ids = ["#card-1", "#card-2", "#card-3", "#card-4"];
        ids.forEach((id, i) => {
          const start = starts[i];
          tl.fromTo(id, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power4.out" }, start);
          if (i < ids.length - 1) {
            tl.to(id, { opacity: 0, duration: 0.08 }, starts[i + 1] - 0.02);
          }
        });
        window.__timelines["scene-blindspots"] = tl;
