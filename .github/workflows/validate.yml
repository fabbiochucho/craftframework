name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI database, reachable only from this job; no password.
          POSTGRES_USER: craft
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: craft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U craft -d craft_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://craft@localhost:5432/craft_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      # npm scripts resolve the lockfile-pinned Deno before Netlify's downloader,
      # whose fallback (2.2.4) cannot accept edge-functions-dev's --allow-scripts.
      - run: npm exec -- deno eval --allow-scripts --quiet --no-lock 'console.log(Deno.version.deno)'
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run docs:api -- --check
      - run: npm run build

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --ignore-scripts
      - run: timeout 120s npm audit --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        timeout-minutes: 10
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          ram: 4096
          threads: 2
      - uses: github/codeql-action/analyze@v4
        timeout-minutes: 15
        with:
          ram: 4096
          threads: 2
