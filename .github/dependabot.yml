version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 1.x removes the brand icons (GitHub, LinkedIn, Facebook, Instagram) used on public pages.
      - dependency-name: lucide-react
        update-types: [version-update:semver-major]
      # Netlify edge-functions-dev passes --allow-scripts, which Deno 2.9 rejects.
      - dependency-name: deno
      # TS 7 drops the JS compiler API that Netlify's Vite plugin needs
      # (via @typescript-eslint/typescript-estree -> ts-api-utils).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # drizzle 1.0.0-rc.5's netlify-db session calls the Neon client as sql(text, params), which
      # @neondatabase/serverless 1.x rejects: every query 500'd in production (#121, reverted in #122).
      # Remove once a release calls httpClient.query (check a DB-backed endpoint on the deploy preview).
      - dependency-name: drizzle-orm
        versions: ["1.0.0-rc.5"]
      - dependency-name: drizzle-kit
        versions: ["1.0.0-rc.5"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
