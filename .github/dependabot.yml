version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 1.x removes the brand icons (GitHub, LinkedIn, Facebook, Instagram) used on public pages.
      - dependency-name: lucide-react
        update-types: [version-update:semver-major]
      # Netlify edge-functions-dev passes --allow-scripts, which Deno 2.9 rejects.
      - dependency-name: deno
      # TS 7 drops the JS compiler API that Netlify's Vite plugin needs
      # (via @typescript-eslint/typescript-estree -> ts-api-utils).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
