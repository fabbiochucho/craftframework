<!doctype html>
<html>
  <head></head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #064e3b;
          overflow: hidden;
          font-family: sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 30px;
        }
        #fw-title {
          font-family: serif;
          font-weight: 700;
          font-size: 42px;
          color: #ffffff;
          opacity: 0;
        }
        #fw-grid {
          display: flex;
          flex-wrap: wrap;
          gap: 18px;
          justify-content: center;
          max-width: 1500px;
        }
        .fw-chip {
          font-family: monospace;
          font-size: 24px;
          color: #064e3b;
          background: #ffffff;
          border-radius: 999px;
          padding: 16px 30px;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="scene-frameworks" data-width="1920" data-height="1080">
        <div id="fw-title">A Library of Specialized Instruments</div>
        <div id="fw-grid">
          <div class="fw-chip" id="fw-c1">Pact Organizational Mapping Tool</div>
          <div class="fw-chip" id="fw-c2">Global Fund Financial Compliance Reporting</div>
          <div class="fw-chip" id="fw-c3">G7 &amp; OECD AI Governance</div>
          <div class="fw-chip" id="fw-c4">ESG &middot; GRI &middot; TCFD</div>
          <div class="fw-chip" id="fw-c5">7-Rung Capital Readiness Ladder</div>
        </div>

        <audio id="fw-narration" src="../assets/voice/l12.wav" data-start="0.3" data-track-index="5" data-volume="1"></audio>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#fw-title", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);
        const chips = ["#fw-c1", "#fw-c2", "#fw-c3", "#fw-c4", "#fw-c5"];
        chips.forEach((c, i) => {
          tl.fromTo(c, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 2.0 + i * 2.6);
        });
        window.__timelines["scene-frameworks"] = tl;
      </script>
    </template>
  </body>
</html>
