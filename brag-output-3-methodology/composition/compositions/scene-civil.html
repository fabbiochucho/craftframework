<!doctype html>
<html>
  <head></head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #ffffff;
          overflow: hidden;
          font-family: sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 32px;
        }
        #cv-label {
          font-family: serif;
          font-weight: 900;
          font-size: 70px;
          color: #064e3b;
          opacity: 0;
        }
        #cv-pills {
          display: flex;
          flex-wrap: wrap;
          gap: 16px;
          justify-content: center;
          max-width: 1300px;
        }
        .cv-pill {
          font-family: monospace;
          font-size: 25px;
          color: #064e3b;
          background: #d1fae5;
          border: 2px solid #10b981;
          border-radius: 999px;
          padding: 14px 26px;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="scene-civil" data-width="1920" data-height="1080">
        <div id="cv-label">Civil Society</div>
        <div id="cv-pills">
          <div class="cv-pill" id="cv-p1">Independent Governance</div>
          <div class="cv-pill" id="cv-p2">Restricted-Fund Accounting</div>
          <div class="cv-pill" id="cv-p3">Safeguarding</div>
          <div class="cv-pill" id="cv-p4">MEL Credibility</div>
        </div>

        <audio id="cv-narration" src="../assets/voice/l09.wav" data-start="0.3" data-track-index="5" data-volume="1"></audio>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#cv-label", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.3);
        const pills = ["#cv-p1", "#cv-p2", "#cv-p3", "#cv-p4"];
        pills.forEach((p, i) => {
          tl.fromTo(p, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.7)" }, 2.0 + i * 1.0);
        });
        window.__timelines["scene-civil"] = tl;
      </script>
    </template>
  </body>
</html>
